name: Obsidian plugin release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:obsidian
      - run: npm run build:obsidian
      - run: npm run verify:obsidian-release -- "$GITHUB_REF_NAME"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" obsidian-plugin/dist/main.js obsidian-plugin/dist/manifest.json obsidian-plugin/dist/styles.css --title "$GITHUB_REF_NAME" --notes "Initial read-only desktop plugin release."
