<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Wiki 工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#/today" aria-label="回到工作台首页"><span class="brand-mark">W<span>·</span></span><span>Wiki 工作台<small>LOCAL MARKDOWN DESK</small></span></a>
        <div class="nav-label">工作空间</div>
        <nav aria-label="主导航">
          <a class="nav-link" data-nav="today" href="#/today"><span class="nav-icon">◫</span> 首页</a>
          <a class="nav-link" data-nav="projects" href="#/projects"><span class="nav-icon">▦</span> 项目</a>
          <a class="nav-link" data-nav="actions" href="#/actions"><span class="nav-icon">☷</span> 行动审阅</a>
          <a class="nav-link" data-nav="weekly" href="#/weekly"><span class="nav-icon">◷</span> 每周回顾</a>
          <a class="nav-link" data-nav="aihot" href="#/aihot"><span class="nav-icon">✦</span> AI 行业日报</a>
          <a class="nav-link" data-nav="inbox" href="#/inbox"><span class="nav-icon">▤</span> 来源收件箱</a>
          <a class="nav-link" data-nav="x" href="#/x"><span class="nav-icon">𝕏</span> 开发者动态</a>
          <a class="nav-link" data-nav="search" href="#/search"><span class="nav-icon">⌕</span> 知识搜索</a>
          <a class="nav-link" data-nav="overview" id="nav-overview" href="#/today" hidden><span class="nav-icon">◈</span> 知识版图</a>
        </nav>
        <div class="sidebar-bottom">
          <a class="sidebar-note" href="#/vault"><span class="pulse-dot"></span><strong id="vault-name">正在读取资料库</strong><small id="vault-status">默认只读</small><small id="vault-path"></small></a>
          <a class="side-index" id="side-index" href="#/today" hidden>打开全局索引 <span>↗</span></a>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="打开菜单">☰</button>
          <div class="breadcrumb">Markdown 资料库 <span>/</span> <strong id="breadcrumb-current">工作台</strong></div>
          <form id="global-search" class="global-search" role="search"><span>⌕</span><input id="global-query" name="q" type="search" placeholder="搜索项目、概念或资料…" autocomplete="off" aria-label="搜索资料库" /><kbd>↵</kbd></form>
          <div class="top-date" id="top-date"></div>
        </header>
        <main id="main" tabindex="-1"><div class="loading-state">正在读取资料库…</div></main>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
